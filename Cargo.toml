[package]
name = "Huffman-web-app"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
shuttle-runtime = "0.57"
shuttle-axum = "0.57"
tower-http = { version = "0.7.0", features = ["fs"] }
serde_json = "1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }