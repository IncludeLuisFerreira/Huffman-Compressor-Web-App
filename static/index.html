<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huffman Compressor — Em Desenvolvimento</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0f0e;
            --bg-panel: #111816;
            --green-neon: #00ff9c;
            --green-dim: #00b874;
            --cyan-neon: #00e5ff;
            --text-primary: #e0f2e9;
            --text-secondary: #9ab0a6;
            --font-mono: 'Share Tech Mono', 'Fira Code', 'Courier New', monospace;
            --border-glow: 0 0 15px rgba(0, 255, 156, 0.4);
            --transition: 0.3s ease;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            /* Impede rolagem, mas conteúdo centralizado */
            font-family: var(--font-mono);
            background: var(--bg-dark);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Canvas de fundo para bits caindo */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            /* permite interação com o conteúdo */
            opacity: 0.35;
            filter: blur(0.5px);
        }

        /* Container principal sobreposto ao canvas */
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
            background: radial-gradient(circle at center, rgba(10, 15, 14, 0.7) 0%, rgba(10, 15, 14, 0.95) 100%);
        }

        /* ===== LOGO / ÍCONE ===== */
        .logo-wrapper {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .logo-tree {
            width: 120px;
            height: 120px;
            filter: drop-shadow(0 0 12px rgba(0, 255, 156, 0.5));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        /* ===== ÁRVORE SVG ===== */
        .tree-svg {
            width: min(280px, 80vw);
            height: auto;
            margin-bottom: 1.8rem;
            filter: drop-shadow(0 0 20px rgba(0, 255, 156, 0.3));
        }

        /* Nós da árvore */
        .node {
            fill: #0d1f1a;
            stroke: var(--green-neon);
            stroke-width: 2.5;
            transform-origin: center;
            transform-box: fill-box;
            animation: pulse 2.4s ease-in-out infinite;
            filter: drop-shadow(0 0 6px rgba(0, 255, 156, 0.7));
        }

        .node:nth-child(2) {
            animation-delay: 0.2s;
        }
        .node:nth-child(3) {
            animation-delay: 0.4s;
        }
        .node:nth-child(4) {
            animation-delay: 0.6s;
        }
        .node:nth-child(5) {
            animation-delay: 0.8s;
        }
        .node:nth-child(6) {
            animation-delay: 1.0s;
        }
        .node:nth-child(7) {
            animation-delay: 1.2s;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
                stroke-width: 2.5;
            }
            50% {
                transform: scale(1.35);
                stroke-width: 3.5;
                fill: #0f2a22;
            }
        }

        /* Arestas (linhas) */
        .edge {
            stroke: var(--green-dim);
            stroke-width: 2;
            stroke-dasharray: 6 4;
            animation: dashFlow 1.2s linear infinite;
            filter: drop-shadow(0 0 4px rgba(0, 255, 156, 0.4));
        }

        .edge-reverse {
            animation-direction: reverse;
        }

        @keyframes dashFlow {
            to {
                stroke-dashoffset: -20;
            }
        }

        /* Labels 0/1 nas arestas */
        .bit-label {
            fill: var(--cyan-neon);
            font-size: 14px;
            font-weight: bold;
            font-family: var(--font-mono);
            text-anchor: middle;
            dominant-baseline: middle;
            filter: drop-shadow(0 0 4px rgba(0, 229, 255, 0.8));
            animation: labelGlow 1.8s ease-in-out infinite;
        }

        @keyframes labelGlow {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
                filter: drop-shadow(0 0 8px rgba(0, 229, 255, 1));
            }
        }

        /* Caracteres nas folhas */
        .leaf-char {
            fill: var(--text-primary);
            font-size: 13px;
            font-weight: bold;
            font-family: var(--font-mono);
            text-anchor: middle;
            dominant-baseline: middle;
        }

        /* ===== TÍTULO PRINCIPAL ===== */
        .main-title {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
            color: var(--green-neon);
            text-shadow: 0 0 10px rgba(0, 255, 156, 0.6), 0 0 30px rgba(0, 255, 156, 0.3);
            animation: titlePulse 3s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%,
            100% {
                text-shadow: 0 0 10px rgba(0, 255, 156, 0.6), 0 0 30px rgba(0, 255, 156, 0.3);
            }
            50% {
                text-shadow: 0 0 20px rgba(0, 255, 156, 0.9), 0 0 50px rgba(0, 255, 156, 0.6);
            }
        }

        .subtitle {
            font-size: clamp(1rem, 3vw, 1.4rem);
            color: var(--text-secondary);
            letter-spacing: 2px;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .typing-text {
            display: inline-block;
            min-width: 12ch;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background: var(--cyan-neon);
            margin-left: 4px;
            animation: blink 0.9s step-end infinite;
            vertical-align: middle;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* ===== BARRA DE PROGRESSO ===== */
        .progress-container {
            width: min(400px, 80vw);
            margin: 0 auto 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            padding: 3px;
            border: 1px solid rgba(0, 255, 156, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 156, 0.2);
        }

        .progress-bar {
            height: 18px;
            border-radius: 50px;
            background: linear-gradient(90deg,
                    var(--green-dim) 0%,
                    var(--green-neon) 30%,
                    var(--cyan-neon) 70%,
                    var(--green-neon) 100%);
            background-size: 200% 100%;
            animation: progressMove 2.5s linear infinite;
            box-shadow: 0 0 12px rgba(0, 255, 156, 0.7);
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.3),
                    transparent);
            transform: translateX(-100%);
            animation: shimmer 2s ease-in-out infinite;
        }

        @keyframes progressMove {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 200% 50%;
            }
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            60%,
            100% {
                transform: translateX(100%);
            }
        }

        .progress-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.8rem;
            letter-spacing: 1px;
        }

        /* ===== MENSAGEM ADICIONAL ===== */
        .status-message {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-top: 2rem;
            padding: 0.8rem 1.5rem;
            background: rgba(0, 255, 156, 0.05);
            border-radius: 8px;
            border: 1px dashed rgba(0, 255, 156, 0.3);
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .status-message span {
            color: var(--green-neon);
            font-weight: bold;
        }

        /* ===== RODAPÉ ===== */
        .footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            z-index: 2;
        }

        .footer a {
            color: var(--green-dim);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer a:hover {
            color: var(--green-neon);
            text-shadow: 0 0 8px rgba(0, 255, 156, 0.6);
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 600px) {
            .tree-svg {
                width: 200px;
            }
            .logo-tree {
                width: 80px;
                height: 80px;
            }
            .subtitle {
                font-size: 0.9rem;
                gap: 5px;
            }
            .progress-container {
                width: 90vw;
            }
            .status-message {
                font-size: 0.8rem;
                padding: 0.6rem 1rem;
            }
        }

        /* Suporte a reduzir movimento */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
    <!-- Fonte monospace temática (com fallback) -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Canvas para bits binários caindo (efeito Matrix) -->
    <canvas id="matrix-canvas"></canvas>

    <!-- Conteúdo principal -->
    <div class="container">
        <!-- Ícone / Logo simples -->
        <div class="logo-wrapper">
            <svg class="logo-tree" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Árvore estilizada -->
                <circle cx="50" cy="30" r="8" fill="#0d1f1a" stroke="#00ff9c" stroke-width="2.5"/>
                <line x1="50" y1="38" x2="30" y2="60" stroke="#00b874" stroke-width="2" stroke-dasharray="4 3"/>
                <line x1="50" y1="38" x2="70" y2="60" stroke="#00b874" stroke-width="2" stroke-dasharray="4 3"/>
                <circle cx="30" cy="60" r="6" fill="#0d1f1a" stroke="#00ff9c" stroke-width="2"/>
                <circle cx="70" cy="60" r="6" fill="#0d1f1a" stroke="#00ff9c" stroke-width="2"/>
                <line x1="30" y1="66" x2="20" y2="85" stroke="#00b874" stroke-width="2" stroke-dasharray="4 3"/>
                <line x1="30" y1="66" x2="40" y2="85" stroke="#00b874" stroke-width="2" stroke-dasharray="4 3"/>
                <line x1="70" y1="66" x2="60" y2="85" stroke="#00b874" stroke-width="2" stroke-dasharray="4 3"/>
                <line x1="70" y1="66" x2="80" y2="85" stroke="#00b874" stroke-width="2" stroke-dasharray="4 3"/>
                <circle cx="20" cy="85" r="4" fill="#0d1f1a" stroke="#00ff9c" stroke-width="1.5"/>
                <circle cx="40" cy="85" r="4" fill="#0d1f1a" stroke="#00ff9c" stroke-width="1.5"/>
                <circle cx="60" cy="85" r="4" fill="#0d1f1a" stroke="#00ff9c" stroke-width="1.5"/>
                <circle cx="80" cy="85" r="4" fill="#0d1f1a" stroke="#00ff9c" stroke-width="1.5"/>
                <!-- Texto "0" e "1" -->
                <text x="36" y="50" fill="#00e5ff" font-size="9" font-weight="bold" font-family="monospace">0</text>
                <text x="62" y="50" fill="#00e5ff" font-size="9" font-weight="bold" font-family="monospace">1</text>
                <text x="18" y="76" fill="#00e5ff" font-size="8" font-weight="bold" font-family="monospace">0</text>
                <text x="42" y="76" fill="#00e5ff" font-size="8" font-weight="bold" font-family="monospace">1</text>
                <text x="58" y="76" fill="#00e5ff" font-size="8" font-weight="bold" font-family="monospace">0</text>
                <text x="82" y="76" fill="#00e5ff" font-size="8" font-weight="bold" font-family="monospace">1</text>
            </svg>
        </div>

        <!-- Árvore binária animada (maior) -->
        <svg class="tree-svg" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
            <!-- Arestas (linhas) -->
            <!-- Nível 1 para 2 -->
            <line x1="150" y1="30" x2="90" y2="80" class="edge" />
            <line x1="150" y1="30" x2="210" y2="80" class="edge edge-reverse" />
            <!-- Nível 2 para 3 -->
            <line x1="90" y1="80" x2="50" y2="140" class="edge" />
            <line x1="90" y1="80" x2="130" y2="140" class="edge edge-reverse" />
            <line x1="210" y1="80" x2="170" y2="140" class="edge" />
            <line x1="210" y1="80" x2="250" y2="140" class="edge edge-reverse" />

            <!-- Labels 0/1 nas arestas -->
            <text x="112" y="52" class="bit-label">0</text>
            <text x="188" y="52" class="bit-label">1</text>
            <text x="62" y="108" class="bit-label">0</text>
            <text x="118" y="108" class="bit-label">1</text>
            <text x="182" y="108" class="bit-label">0</text>
            <text x="238" y="108" class="bit-label">1</text>

            <!-- Nós (círculos) -->
            <circle cx="150" cy="30" r="12" class="node" />
            <circle cx="90" cy="80" r="10" class="node" />
            <circle cx="210" cy="80" r="10" class="node" />
            <circle cx="50" cy="140" r="8" class="node" />
            <circle cx="130" cy="140" r="8" class="node" />
            <circle cx="170" cy="140" r="8" class="node" />
            <circle cx="250" cy="140" r="8" class="node" />

            <!-- Caracteres nas folhas (exemplos) -->
            <text x="50" y="165" class="leaf-char">'A'</text>
            <text x="130" y="165" class="leaf-char">'B'</text>
            <text x="170" y="165" class="leaf-char">'C'</text>
            <text x="250" y="165" class="leaf-char">'D'</text>
        </svg>

        <!-- Título principal -->
        <h1 class="main-title">Huffman Compressor</h1>

        <!-- Subtítulo com efeito de digitação -->
        <div class="subtitle">
            <span>⚙️</span>
            <span class="typing-text" id="typing-text">Em Desenvolvimento</span>
            <span class="cursor"></span>
            <span>⚙️</span>
        </div>

        <!-- Barra de progresso animada -->
        <div class="progress-label">⏳ Progresso da implementação</div>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <!-- Mensagem de status -->
        <div class="status-message">
            <span>Compressão em andamento...</span> Estamos construindo o algoritmo de Huffman.
            <br>Volte em breve para compactar seus dados! 📦➡️🗜️
        </div>
    </div>

    <!-- Rodapé -->
    <div class="footer">
        © 2025 Huffman Compressor • <a href="#">Sobre</a> • <a href="#">Contato</a>
    </div>

    <script>
        (function() {
            // ===== 1. EFEITO DE DIGITAÇÃO (subtitle) =====
            const typingElement = document.getElementById('typing-text');
            const baseText = 'Em Desenvolvimento';
            const dots = ['.', '..', '...'];
            let dotIndex = 0;
            let isDeleting = false;
            let charIndex = baseText.length;
            let currentText = baseText;

            function typeEffect() {
                if (!isDeleting) {
                    // Adiciona caracteres
                    if (charIndex < baseText.length) {
                        charIndex++;
                        currentText = baseText.substring(0, charIndex);
                        typingElement.textContent = currentText;
                        setTimeout(typeEffect, 120);
                    } else {
                        // Palavra completa, agora anima os pontos
                        isDeleting = true;
                        setTimeout(typeEffect, 400);
                    }
                } else {
                    // Remove caracteres
                    if (charIndex > 0) {
                        charIndex--;
                        currentText = baseText.substring(0, charIndex);
                        typingElement.textContent = currentText;
                        setTimeout(typeEffect, 60);
                    } else {
                        // Palavra apagada, reinicia
                        isDeleting = false;
                        charIndex = 0;
                        setTimeout(typeEffect, 800);
                    }
                }
            }

            // Iniciar efeito de digitação após um pequeno atraso
            setTimeout(typeEffect, 500);

            // ===== 2. CANVAS DE BITS CAINDO (Matrix) =====
            const canvas = document.getElementById('matrix-canvas');
            const ctx = canvas.getContext('2d');

            let width, height;
            let fontSize = 16;
            let columns, drops;

            function setupCanvas() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                columns = Math.floor(width / fontSize);
                drops = Array(columns).fill(0).map(() => Math.random() * -100);
            }

            function drawMatrix() {
                // Fundo semi-transparente para rastro
                ctx.fillStyle = 'rgba(10, 15, 14, 0.1)';
                ctx.fillRect(0, 0, width, height);

                // Configuração do texto
                ctx.font = fontSize + 'px "Share Tech Mono", monospace';
                ctx.fillStyle = '#00ff9c';
                ctx.shadowColor = '#00ff9c';
                ctx.shadowBlur = 4;

                for (let i = 0; i < columns; i++) {
                    // Caractere aleatório (0 ou 1, ou às vezes espaço)
                    const char = Math.random() > 0.5 ? '1' : '0';
                    const x = i * fontSize;
                    const y = drops[i] * fontSize;

                    ctx.fillText(char, x, y);

                    // Reinicia quando sai da tela
                    if (y > height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }

                // Reduz sombra para performance
                ctx.shadowBlur = 0;
                requestAnimationFrame(drawMatrix);
            }

            // Redimensionar canvas
            window.addEventListener('resize', () => {
                setupCanvas();
            });

            // Iniciar animação do canvas
            setupCanvas();
            drawMatrix();

            // ===== 3. ANIMAÇÃO DA ÁRVORE (já feita via CSS, mas adiciona interação sutil) =====
            // Pode adicionar um leve efeito de hover nos nós se desejar, mas não é necessário.

            // ===== 4. AJUSTE DE FOCO PARA ACESSIBILIDADE =====
            // Adiciona outline para navegação por teclado
            document.querySelectorAll('a').forEach(link => {
                link.addEventListener('focus', () => {
                    link.style.outline = '2px solid var(--green-neon)';
                });
                link.addEventListener('blur', () => {
                    link.style.outline = 'none';
                });
            });
        })();
    </script>
</body>
</html>
